<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cravely – Pixel Kitchen Oven Login</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff1dc;--dark:#3a1d17;--coral:#f08f86;--coral-d:#c9605a;--coral-l:#ffc2b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{overflow:hidden;background:#2a1a12;font-family:'Pixelify Sans','Courier New',monospace;color:var(--ink)}
svg{shape-rendering:crispEdges}

/* ---- Foto penuh (contain) + backdrop blur untuk sisa layar ---- */
.wall{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;transform:translate(var(--dx,0px),var(--dy,0px)) scale(var(--s,1));transition:transform 1.2s cubic-bezier(.65,0,.25,1)}
.photo{display:block;width:100%;height:100%;image-rendering:pixelated;transition:filter 1.2s}
.wall.zoomed .photo{filter:brightness(.6) saturate(.9)}

/* ---- Oven di foto = tempat login/register ---- */
.da{position:absolute;left:62.86%;top:65.1%;width:17.41%;height:22.1%;container-type:inline-size;perspective:260cqw}
.cav,.door{position:absolute;inset:0}
.cav{display:grid;place-items:center;background:#ea9f52;
  box-shadow:inset 0 0 0 1.4cqw #2e1a10,inset 0 0 0 3cqw #6e3a1c,inset 0 0 0 4.6cqw #b2672e}
.cav::before,.cav::after{content:"";position:absolute;top:6cqw;bottom:6cqw;left:5.4cqw;width:2.4cqw;background:repeating-linear-gradient(0deg,#f9d99a 0 .7cqw,transparent .7cqw 4cqw);opacity:.85}
.cav::after{left:auto;right:5.4cqw}
.door{transform-origin:50% 100%;transition:transform .9s cubic-bezier(.5,.1,.2,1);cursor:pointer;
  background:linear-gradient(90deg,#d9cdb4,#f2e9d6 12%,#f2e9d6 88%,#d9cdb4);box-shadow:inset 0 -1.4cqw 0 #cbbd9f,0 0 0 .6cqw #bfae8c;z-index:2}
.door:hover{filter:brightness(1.05)}
.hd{position:absolute;left:7%;right:7%;top:3.2%;height:5.2%;background:#d9a55f;box-shadow:0 1cqw 0 #a5733a}
.win{position:absolute;left:11%;top:22%;width:80%;height:59%;background:#2a2022;box-shadow:0 0 0 1.4cqw #5a4034,inset 1cqw 1cqw 0 #3d2e30;display:grid;place-items:center;overflow:hidden}
.oven[data-open] .door{transform:rotateX(-84deg);pointer-events:none;cursor:default;transition-delay:.75s}
.oven[data-open] .gl,.oven[data-open] .hand{opacity:0}
.spill{position:absolute;left:0;right:0;top:100%;height:60cqw;background:radial-gradient(ellipse at 50% 0,rgba(255,170,80,.55),transparent 70%);opacity:0;transition:opacity 1s .8s;pointer-events:none}
.oven[data-open] .spill{opacity:1}

/* layar kaca (di jendela pintu) */
.gl{grid-area:1/1;display:none;place-items:center;align-content:center;gap:1.4cqw;text-align:center;transition:opacity .2s}
.oven[data-view=welcome] .g-welcome,.oven[data-view=closing] .g-closing,.oven[data-view=success] .g-success{display:grid}
.gl h2{font-size:9cqw;line-height:1;font-weight:700;letter-spacing:.2cqw}
.gl p{font-size:4.1cqw;opacity:.85}
.hat{width:14cqw;color:var(--ink)}
.spin{width:9cqw;aspect-ratio:1;border:1.6cqw solid #6a4535;border-top-color:var(--coral);animation:sp .9s steps(8) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spark{position:absolute;color:#f4c35a;font-size:7cqw;animation:tw 1.4s steps(3) infinite}
.spark.l{left:8%;top:12%}.spark.r{right:8%;top:6%;animation-delay:.5s}
@keyframes tw{50%{transform:scale(.55);opacity:.6}}
.ting{position:absolute;right:-4cqw;top:-7cqw;font-weight:700;font-size:9cqw;color:#fff;text-shadow:0 .8cqw 0 var(--dark);opacity:0;z-index:5;pointer-events:none}
.oven[data-view=success] .ting{animation:ting 2.6s 1.1s both}
@keyframes ting{0%{opacity:0;transform:translateY(3cqw)}15%,80%{opacity:1;transform:none}100%{opacity:0}}
.link{background:none;border:0;color:#ffd9c9;font:600 4.3cqw 'Pixelify Sans',monospace;text-decoration:underline;cursor:pointer;margin-top:1cqw}
.hand{position:absolute;right:-1cqw;bottom:-13cqw;width:17cqw;z-index:3;pointer-events:none;animation:tap 1.2s steps(2) infinite;transition:opacity .2s}
@keyframes tap{50%{transform:translate(-1.6cqw,-2.4cqw)}}

/* rak & baki: semua tingkat terbuka dalam 1 form */
.rack{display:none;position:absolute;inset:4.6cqw 9cqw 6.8cqw;flex-direction:column;gap:1.4cqw;z-index:1}
.oven[data-view=login] #rackLogin,.oven[data-view=reg] #rackReg{display:flex;animation:in .4s both steps(4)}
@keyframes in{from{opacity:0;transform:translateY(2cqw)}}

.ttl{flex:none;height:5.6cqw;display:flex;align-items:center;justify-content:center;gap:1.6cqw;font-size:5.8cqw;font-weight:700;text-shadow:0 .6cqw 0 var(--dark)}
.ttl svg{width:5.6cqw}

.trays{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.8cqw}
#rackReg .trays{gap:1.4cqw}

.tray{
  display:flex;flex-direction:column;gap:1.2cqw;padding:1.8cqw 2.8cqw 2.2cqw;
  background:linear-gradient(#635c5e,#453e40);
  box-shadow:0 0 0 .7cqw var(--dark),0 1.4cqw 0 .7cqw rgba(40,20,10,.45),inset 0 .8cqw 0 #aaa2a0,inset 0 -.8cqw 0 #2f292b;
  transition:transform .2s,box-shadow .2s,background .2s;
}
#rackReg .tray{gap:.8cqw;padding:1.1cqw 2.6cqw 1.6cqw}
.tray:focus-within{
  background:linear-gradient(#6f6669,#4d4446);
  transform:translateY(-.5cqw);
  box-shadow:0 0 0 .7cqw var(--dark),0 1.9cqw 0 .7cqw rgba(40,20,10,.5),0 0 0 1.2cqw rgba(255,194,184,.55),inset 0 .8cqw 0 #c5bbb8,inset 0 -.8cqw 0 #2f292b;
}

.hdr{display:flex;align-items:center;gap:1.8cqw;height:4.8cqw;font-size:4.1cqw;font-weight:600;white-space:nowrap}
#rackReg .hdr{height:4.1cqw;font-size:3.7cqw}
.hdr b{color:#f2c98a;font-weight:700}
.hdr svg{width:4.4cqw;flex:none;opacity:.22;filter:grayscale(1);transition:opacity .2s,filter .2s}
.tray.done .hdr svg{opacity:1;filter:none}

.err{flex:1;text-align:right;font-size:3.3cqw;line-height:1;color:#ffe08a;text-shadow:0 .4cqw 0 var(--dark);overflow:hidden;text-overflow:ellipsis}

.f{width:100%;display:flex;align-items:center;height:10.6cqw;padding:0 2.8cqw;background:#2f1b14;box-shadow:0 0 0 .7cqw var(--dark),inset .8cqw .8cqw 0 rgba(0,0,0,.45)}
#rackReg .f{height:9cqw;padding:0 2.4cqw}
.f input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);font:500 4.8cqw 'Pixelify Sans',monospace}
#rackReg .f input{font-size:4.4cqw}
.f input::placeholder{color:rgba(255,235,215,.5)}
.f:focus-within{box-shadow:0 0 0 .7cqw var(--dark),0 0 0 1.4cqw var(--coral-l),inset .8cqw .8cqw 0 rgba(0,0,0,.45)}

.eye{background:none;border:0;cursor:pointer;color:var(--ink);opacity:.8;font:600 3.7cqw 'Pixelify Sans',monospace;padding-left:1.5cqw}
.row{flex:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:2cqw;padding:0 .5cqw}
.btn{height:9.6cqw;padding:0 4.4cqw;border:0;border-radius:0;font:700 4.8cqw 'Pixelify Sans',monospace;color:#fff;cursor:pointer;background:var(--coral);
  box-shadow:0 0 0 .7cqw var(--dark),inset -.9cqw -.9cqw 0 var(--coral-d),inset .9cqw .9cqw 0 var(--coral-l);text-shadow:0 .5cqw 0 rgba(90,30,30,.5)}
.btn:active{transform:translateY(.8cqw)}
.btn.ghost{background:#8a5a46;box-shadow:0 0 0 .7cqw var(--dark),inset -.9cqw -.9cqw 0 #6a4132,inset .9cqw .9cqw 0 #ad7c64}
.shut{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:calc(100% + 11cqw);height:9cqw;font-size:4.6cqw;opacity:0;pointer-events:none;z-index:4}
.oven[data-open] .shut{opacity:1;pointer-events:auto;transition:opacity .3s 1.5s}
.shake{animation:sh .3s steps(4)}
@keyframes sh{25%{transform:translateX(-1.4cqw)}75%{transform:translateX(1.4cqw)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ---- Fix: ikon tangan hanya muncul di welcome ---- */
.oven:not([data-view=welcome]) .hand{display:none}

/* ---- Opsi 1: Papan Sambutan Pixel (Chalkboard Sign) ---- */
.sign{
  position:fixed;left:clamp(20px,5.5vw,68px);top:clamp(24px,8vh,72px);
  width:min(350px,calc(100vw - 40px));z-index:10;
  padding:20px 22px 18px;background:#261b1d;color:var(--ink);
  box-shadow:
    0 0 0 4px #6e3a1c,
    0 0 0 8px #b2672e,
    0 0 0 11px var(--dark),
    0 14px 0 8px rgba(20,10,6,.45),
    inset 0 0 0 3px #3d2c2e;
  transition:opacity .45s ease,transform .55s cubic-bezier(.6,0,.25,1);
}
/* Tali gantung pixel ke tepi atas layar */
.sign::before,.sign::after{
  content:"";position:absolute;bottom:calc(100% + 11px);width:4px;height:120px;
  background:repeating-linear-gradient(180deg,#d9a55f 0 6px,#8a5a46 6px 10px);
  box-shadow:2px 0 0 var(--dark);pointer-events:none;
}
.sign::before{left:36px}
.sign::after{right:36px}

/* Hilang mulus saat kamera zoom ke oven */
.wall.zoomed .sign{opacity:0;transform:translateY(-28px);pointer-events:none}

.sign-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sign-brand svg{width:30px;height:22px;color:var(--coral-l);flex:none}
.sign-brand h1{font-size:28px;line-height:1;letter-spacing:1px;text-shadow:0 3px 0 var(--dark)}
.sign-tag{font-size:14px;line-height:1.45;color:#f5dfc2;opacity:.92;margin-bottom:16px}
.sign-actions{display:flex;gap:12px}
.s-btn{
  flex:1;height:42px;border:0;cursor:pointer;
  font:700 16px 'Pixelify Sans',monospace;color:#fff;background:var(--coral);
  box-shadow:0 0 0 3px var(--dark),inset -3px -3px 0 var(--coral-d),inset 3px 3px 0 var(--coral-l);
  text-shadow:0 2px 0 rgba(90,30,30,.5);transition:filter .15s,transform .1s;
}
.s-btn:hover{filter:brightness(1.07)}
.s-btn:active{transform:translateY(2px)}
.s-btn.ghost{
  background:#8a5a46;
  box-shadow:0 0 0 3px var(--dark),inset -3px -3px 0 #6a4132,inset 3px 3px 0 #ad7c64;
}
.sign-hint{margin-top:12px;font-size:12px;color:#ffd9c9;opacity:.75;text-align:center}

@media (max-width:640px){
  .sign{left:0;right:0;margin:0 auto;top:22px;padding:16px 18px 14px}
  .sign-brand h1{font-size:24px}
}

/* ---- Opsi 3: Pendar Hangat Kaca Oven + Uap Pixel ---- */
.win{position:relative}
.gl{position:relative;z-index:1}
.win::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,rgba(255,168,76,.48),rgba(240,115,65,.18) 55%,transparent 82%);
  opacity:0;transition:opacity .4s;
}
.oven[data-view=welcome] .win::before,
.oven[data-view=closing] .win::before{
  opacity:1;animation:ovenGlow 2.4s steps(4) infinite;
}
.oven[data-view=welcome] .door:hover .win::before{filter:brightness(1.25)}
@keyframes ovenGlow{
  0%,100%{opacity:.55;transform:scale(.96)}
  50%{opacity:1;transform:scale(1.06)}
}

/* Uap hangat naik dari atas oven */
.steam{
  position:absolute;left:18%;right:18%;top:-18cqw;height:20cqw;
  pointer-events:none;z-index:2;opacity:0;transition:opacity .4s;
}
.oven[data-view=welcome] .steam,
.oven[data-view=closing] .steam{opacity:1}
.steam i{
  position:absolute;bottom:0;width:5cqw;height:5cqw;background:rgba(255,241,220,.7);
  box-shadow:3cqw -2cqw 0 rgba(255,241,220,.45);
  animation:steamUp 2.6s steps(5) infinite;
}
.steam i:nth-child(1){left:12%;animation-delay:0s}
.steam i:nth-child(2){left:46%;animation-delay:.85s;width:6cqw;height:6cqw}
.steam i:nth-child(3){left:74%;animation-delay:1.6s;width:4cqw;height:4cqw}
@keyframes steamUp{
  0%{transform:translateY(0);opacity:0}
  25%{opacity:.75}
  100%{transform:translateY(-17cqw) translateX(2cqw);opacity:0}
}
</style>
</head>

<script>
const $=s=>document.querySelector(s), oven=$('#oven'), wall=$('#wall'), stage=$('#stage');
const R=735/493, FX=.6286+.1741/2, FY=.651+.221/2, PY=.8;
const isOpen=()=>oven.dataset.view==='login'||oven.dataset.view==='reg';

function geo(){
  const vw=innerWidth, vh=innerHeight, Sw=Math.max(vw,vh*R), Sh=Sw/R;
  const px=Sw>vw+1?Math.min(1,Math.max(0,(vw/2-FX*Sw)/(vw-Sw))):.5;
  return{vw,vh,Sw,Sh,sl:(vw-Sw)*px,st:(vh-Sh)*PY};
}
function zoom(){
  const g=geo(), on=oven.dataset.view!=='welcome';
  Object.assign(stage.style,{width:g.Sw+'px',height:g.Sh+'px',left:g.sl+'px',top:g.st+'px',transformOrigin:(FX*100)+'% '+(FY*100)+'%'});
  wall.classList.toggle('zoomed',on);
  if(!on){stage.style.setProperty('--s',1);stage.style.setProperty('--dx','0px');stage.style.setProperty('--dy','0px');return}
  const X=g.sl+g.Sw*FX, Y=g.st+g.Sh*FY, Wd=g.Sw*.1741;
  const Wt=Math.min(g.vw*(g.vw<g.vh*.9?.94:.5), g.vh*.728);
  stage.style.setProperty('--s',Wt/Wd);
  stage.style.setProperty('--dx',(g.vw/2-X)+'px');
  stage.style.setProperty('--dy',(g.vh*.45-Y)+'px');
}

function go(v){
  const target=v.replace(/\d+$/,''); // kompatibel dgn login1/reg1
  const wasOpen=isOpen();
  oven.dataset.view=target;
  document.querySelectorAll('.err').forEach(e=>e.textContent='');
  if(isOpen()){
    oven.setAttribute('data-open','');
    setTimeout(()=>{
      if(oven.dataset.view===target){
        const i=document.querySelector(`#rack${target==='login'?'Login':'Reg'} input`);
        i&&i.focus({preventScroll:true});
      }
    }, !wasOpen ? 1950 : 350);
  } else {
    oven.removeAttribute('data-open');
  }
  zoom();
}

function fail(id,msg,el){
  $(id).textContent=msg;
  const p=el.closest('.tray');
  p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
}
function finish(m){
  go('closing');
  $('#sTitle').textContent=m==='reg'?'Success!':'Welcome back!';
  $('#sMsg').textContent=m==='reg'?'Registration Complete!':'Login successful';
  setTimeout(()=>{go('success');ting()},2300);
}
function ting(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[1318,1975].forEach((f,i)=>{const t=a.currentTime+1.1+i*.12,o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.8)})}catch(e){}}

// Nyalakan ikon cookie di tiap baki saat terisi valid
const rules={
  lu:v=>v.trim().length>0,
  lp:v=>v.length>0,
  rn:v=>v.trim().length>0,
  re:v=>/^\S+@\S+\.\S+$/.test(v.trim()),
  rp:v=>v.length>=6
};
document.addEventListener('input',e=>{
  const i=e.target;
  if(!rules[i.id])return;
  const tray=i.closest('.tray');
  tray.classList.toggle('done',rules[i.id](i.value));
  tray.querySelector('.err').textContent='';
});

// Submit Login (2 tingkat sekaligus)
$('#rackLogin').addEventListener('submit',e=>{
  e.preventDefault();
  let ok=true, first=null;
  if(!rules.lu($('#lu').value)){fail('#e1','Enter email/user',$('#lu'));ok=false;first=first||$('#lu')}
  if(!rules.lp($('#lp').value)){fail('#e2','Enter password',$('#lp'));ok=false;first=first||$('#lp')}
  if(!ok)return first.focus();
  finish('login');
});

// Submit Register (3 tingkat sekaligus)
$('#rackReg').addEventListener('submit',e=>{
  e.preventDefault();
  let ok=true, first=null;
  if(!rules.rn($('#rn').value)){fail('#e3','Enter your name',$('#rn'));ok=false;first=first||$('#rn')}
  if(!rules.re($('#re').value)){fail('#e4','Invalid email',$('#re'));ok=false;first=first||$('#re')}
  if(!rules.rp($('#rp').value)){fail('#e5','Min. 6 chars',$('#rp'));ok=false;first=first||$('#rp')}
  if(!ok)return first.focus();
  finish('reg');
});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-eye]');
  if(!t){if(isOpen()&&!e.target.closest('#oven'))go('welcome');return}
  if(t.dataset.go)go(t.dataset.go);
  else{
    const i=$('#'+t.dataset.eye);
    const show=i.type==='password';
    i.type=show?'text':'password';
    t.textContent=show?'hide':'show';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen())go('welcome')});

const door=$('#door');
door.addEventListener('click',()=>{if(oven.dataset.view==='welcome')go('login')});
door.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&oven.dataset.view==='welcome'){e.preventDefault();go('login')}});
$('#again').addEventListener('click',e=>{
  e.stopPropagation();
  ['lu','lp','rn','re','rp'].forEach(id=>{
    const el=$('#'+id);el.value='';el.closest('.tray').classList.remove('done');
  });
  go('welcome');
});
addEventListener('resize',zoom);zoom();
</script>
</body>
</html>
