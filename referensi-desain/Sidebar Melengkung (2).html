<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidebar Melengkung</title>
<style>
:root{
  --bg:#f5f4fc; --card:#ffffff; --text:#2b2850; --muted:#8a87a8;
  --side:#6c5ce7; --side-2:#5f4fdc; --w-closed:84px; --w-open:236px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15132b;--card:#1f1c3d;--text:#ecebff;--muted:#9a97c0;}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Poppins","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;left:0;top:50%;transform:translateY(-50%);
  width:var(--w-closed);height:auto;max-height:calc(100vh - 16px);--cap:clamp(60px,10vh,90px);padding:calc(var(--cap) + 6px) 14px;
  display:flex;flex-direction:column;color:#fff;z-index:20;
  transition:width .35s cubic-bezier(.4,0,.2,1);
}
.sidebar.open{width:var(--w-open)}
.bg{position:absolute;inset:0;display:flex;flex-direction:column;z-index:0}
.bg .r{display:flex;flex:none}
.bg .r.t,.bg .r.b{height:var(--cap)}
.bg .r.m{flex:1;min-height:0;margin:-1px 0}
.bg .r.b{transform:scaleY(-1)}
.bg .fill{flex:1;background:var(--side);margin-right:-1px}
.bg svg{width:var(--w-closed);height:100%;flex:none;display:block}

.bg path{fill:var(--side)}
.body{position:relative;z-index:1;margin:0 -14px;padding:0 14px}
nav{display:flex;flex-direction:column;gap:clamp(4px,1.1vh,10px)}
.brand{display:flex;align-items:center;gap:14px;padding:0 6px 14px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(135deg,#ffc27a,#ff8a5c);display:grid;place-items:center;box-shadow:0 6px 14px rgba(30,20,110,.3)}
.logo svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo svg .f{fill:#fff;stroke:none}
.brand-text{line-height:1.15;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:.25s;pointer-events:none}
.brand-text strong{display:block;font-size:18px;font-weight:700;letter-spacing:.2px}
.brand-text small{font-size:11px;opacity:.75}
.sidebar.open .brand-text{opacity:1;transform:none;transition-delay:.12s}
.item{
  position:relative;display:flex;align-items:center;gap:14px;height:clamp(40px,6vh,52px);
  padding:0 15px;border-radius:16px;color:rgba(255,255,255,.85);
  text-decoration:none;cursor:pointer;border:0;background:none;font:inherit;width:100%;
  transition:background .2s,color .2s;
}
.item:hover{background:rgba(255,255,255,.14)}
.item.active{background:#fff;color:var(--side);box-shadow:0 8px 18px rgba(30,20,110,.28)}
.item svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item svg .f{fill:currentColor;stroke:none}
.label{white-space:nowrap;font-size:14px;font-weight:500;opacity:0;transform:translateX(-8px);transition:.25s;pointer-events:none}
.sidebar.open .label{opacity:1;transform:none;transition-delay:.12s}
.badge{position:absolute;top:8px;left:30px;font-size:8px;font-weight:700;background:#22c58b;color:#fff;padding:2px 6px;border-radius:8px;letter-spacing:.3px}
.dot{position:absolute;top:12px;left:32px;width:8px;height:8px;border-radius:50%;border:2px solid var(--side)}
.dot.orange{background:#ffa43a}.dot.blue{background:#4cc3ff}
.sidebar.open .badge{left:auto;right:14px;top:18px}
.sidebar.open .dot{left:auto;right:18px;top:23px}

/* tooltip saat tertutup */
.sidebar:not(.open) .item:hover::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 18px);background:var(--text);color:var(--bg);
  font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;
}

/* tombol toggle di tepi */
.toggle{
  position:absolute;right:-14px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;border:0;background:#fff;color:var(--side);
  box-shadow:0 4px 12px rgba(30,20,110,.3);cursor:pointer;display:grid;place-items:center;z-index:2;
}
.toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.sidebar.open .toggle svg{transform:rotate(180deg)}

/* ===== KONTEN ===== */
main{margin-left:var(--w-closed);padding:28px 28px 40px;transition:margin-left .35s cubic-bezier(.4,0,.2,1)}
body.open main{margin-left:var(--w-open)}
header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.menu-btn{width:42px;height:42px;border-radius:12px;border:0;background:var(--card);color:var(--side);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(80,60,200,.1)}
.menu-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
h1{font-size:22px}
p.sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(80,60,200,.08)}
.card b{display:block;font-size:26px;margin-top:6px;color:var(--side)}
.card span{color:var(--muted);font-size:13px}

@media (max-width:640px){
  :root{--w-closed:72px;--w-open:220px}
  body.open main{margin-left:var(--w-closed)}
  main{padding:20px 16px}
  .body{padding-inline:14px}
  .item{padding:0 10px}
  .brand{padding-inline:0}
}
@media (max-height:700px){:root{--cap:56px}.sidebar{--cap:56px}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="bg"><div class="r t"><i class="fill"></i><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0H12C66 0 97 28 97 100H0Z"/></svg></div><div class="r m"><i class="fill"></i><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0H97Q101 50 97 100H0Z"/></svg></div><div class="r b"><i class="fill"></i><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0H12C66 0 97 28 97 100H0Z"/></svg></div></div>

  <div class="body">
    <button class="toggle" id="toggle" aria-label="Buka/tutup sidebar">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M6 12.5h12l-1.4 7.2a1.5 1.5 0 0 1-1.5 1.3H8.9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M5.5 12.5a3.5 3.5 0 0 1 2-3.2 4.5 4.5 0 0 1 9 0 3.5 3.5 0 0 1 2 3.2z"/><circle class="f" cx="12" cy="4.2" r="1.2"/></svg></div>
      <div class="brand-text"><strong>Cravely</strong><small>Bakery</small></div>
    </div>

    <nav>
      <a class="item active" data-tip="Dashboard">
        <svg viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="3.5" opacity=".55"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="3.5" opacity=".55"/><rect class="f" x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <span class="label">Dashboard</span>
      </a>
      <a class="item" data-tip="Profil">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"/></svg>
        <span class="label">Profil</span>
      </a>
      <a class="item" data-tip="Statistik">
        <svg viewBox="0 0 24 24"><path d="M11 3.2A9 9 0 1 0 20.8 13H11z"/><path d="M14.5 3.6A9 9 0 0 1 20.4 9.5H14.5z"/></svg>
        <span class="label">Statistik</span><i class="badge">NEW</i>
      </a>
      <a class="item" data-tip="Notifikasi">
        <svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.6 2H4.4z"/><path d="M10 21h4"/></svg>
        <span class="label">Notifikasi</span>
      </a>
      <a class="item" data-tip="Kalender">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2" /></svg>
        <span class="label">Kalender</span>
      </a>
      <a class="item" data-tip="Pesan">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5"/></svg>
        <span class="label">Pesan</span><i class="dot orange"></i>
      </a>
      <a class="item" data-tip="Catatan">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 15l.7-2.7 5.5-5.5 2 2-5.5 5.5z"/></svg>
        <span class="label">Catatan</span>
      </a>
      <a class="item" data-tip="Obrolan">
        <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 0-6.9 12L4 20l4.2-1.1A8 8 0 1 0 12 4z"/></svg>
        <span class="label">Obrolan</span><i class="dot blue"></i>
      </a>
    </nav>
  </div>

  
</aside>

<main>
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button>
    <div>
      <h1 id="title">Dashboard</h1>
      <p class="sub">Klik ikon di sidebar atau tombol menu untuk membuka dan menutup.</p>
    </div>
  </header>
  <section class="grid">
    <div class="card"><span>Total Pengguna</span><b>12.480</b></div>
    <div class="card"><span>Pesanan Baru</span><b>348</b></div>
    <div class="card"><span>Pendapatan</span><b>Rp 48,2 jt</b></div>
    <div class="card"><span>Pesan Belum Dibaca</span><b>17</b></div>
  </section>
</main>

<script>
(function(){
  var sb=document.getElementById('sidebar'), body=document.body;
  function setOpen(v){ sb.classList.toggle('open',v); body.classList.toggle('open',v); }
  function toggle(){ setOpen(!sb.classList.contains('open')); }
  document.getElementById('toggle').addEventListener('click',toggle);
  document.getElementById('menuBtn').addEventListener('click',toggle);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') setOpen(false); });

  var items=sb.querySelectorAll('.item'), title=document.getElementById('title');
  items.forEach(function(it){
    it.addEventListener('click',function(){
      items.forEach(function(i){i.classList.remove('active')});
      it.classList.add('active');
      title.textContent=it.dataset.tip;
    });
  });
})();
</script>
</body>
</html>
