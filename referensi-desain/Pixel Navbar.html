.lnk.active{color:#ffbf3f;font-size:1.55cqw}
.lnk[href="#home"]{margin-left:1cqw}
.lnk.active::after{content:"";position:absolute;left:.8cqw;right:.8cqw;bottom:.6cqw;height:.17cqw;background:#f5b73b;box-shadow:0 0 .4cqw rgba(245,183,59,.7)}
.lnk.active::before{content:"";position:absolute;left:50%;bottom:.43cqw;width:.5cqw;height:.5cqw;margin-left:-.25cqw;transform:rotate(45deg);background:#07173a;border:.12cqw solid #f5b73b;z-index:1}
.hit{position:absolute;top:48.969%;width:4.6cqw;height:4.6cqw;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;transition:background .15s}
.hit:hover{background:radial-gradient(circle,rgba(245,183,59,.28),transparent 70%)}
.hit:focus-visible{outline:2px solid #ffd37a}
.mute{position:absolute;top:48.969%;left:83.271%;width:3.2cqw;height:.22cqw;background:#0a1d44;border-top:.1cqw solid #f5b73b;transform:translate(-50%,-50%) rotate(-40deg);display:none;pointer-events:none}
.nav.muted .mute{display:block}
.demo{max-width:1100px;margin:36px auto 0;padding:0 16px;font-size:18px}
</style></head><body>
<div class="scroller"><nav class="nav" id="nav" aria-label="Navigasi utama">
<a href="#home" class="lnk active" style="left:13.243%">Home</a><a href="#about" class="lnk" style="left:22.212%">About</a><a href="#projects" class="lnk" style="left:31.366%">Projects</a><a href="#sertifikat" class="lnk" style="left:42.333%">Sertifikat</a><a href="#gallery" class="lnk" style="left:53.02%">Gallery</a><a href="#comments" class="lnk" style="left:63.058%">Comments</a><a href="#contact" class="lnk" style="left:73.234%">Contact</a><button class="hit" id="logo" aria-label="Beranda" style="left:6.273%"></button><button class="hit" id="snd" aria-label="Suara" style="left:83.271%"></button><button class="hit" id="theme" aria-label="Ganti tema" style="left:88.569%"></button><button class="hit" id="set" aria-label="Pengaturan" style="left:93.82%"></button><span class="mute"></span>
</nav></div>
<div class="demo" id="out">Halaman aktif: Home</div>
<script>
(function(){
var nav=document.getElementById('nav'),out=document.getElementById('out'),ls=[].slice.call(document.querySelectorAll('.lnk'));
function set(n){ls.forEach(function(a){var on=a.getAttribute('href')==='#'+n;a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});out.textContent='Halaman aktif: '+n.charAt(0).toUpperCase()+n.slice(1)}
ls.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();set(a.getAttribute('href').slice(1))})});
document.getElementById('logo').onclick=function(){set('home')};
document.getElementById('snd').onclick=function(){nav.classList.toggle('muted')};
document.getElementById('theme').onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
document.getElementById('set').onclick=function(){out.textContent='Pengaturan diklik (sambungkan ke modal kamu).'};
})();
</script></body></html>
