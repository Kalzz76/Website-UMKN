<style>

function cakeSVG(size,body,ice){const rx=20+SZ[size].d*1.75,t=36,b=64,d=[8,15,6,13,9];

 d.forEach((l,i)=>{const x=60-rx+8+i*(2*rx-16)/4;o+=`<rect x="${x-3.5}" y="${t}" width="7" height="${l+4}" rx="3.5" fill="${ice}"/>`});

 [[-.45,2],[0,-1],[.45,2]].forEach(([k,dy])=>{const x=60+rx*k;o+=`<circle cx="${x}" cy="${t-3+dy}" r="6" fill="#e0303f"/><path d="M${x-3},${t-8+dy}h6l-3 3z" fill="#3d9a4a"/>`});
 return o+`</svg>`}
function shapeSVG(k){const st=`fill="#fbefd5" stroke="#D96B91" stroke-width="4" stroke-linejoin="round"`;let b="";
 if(k==="round")b=`<ellipse cx="60" cy="46" rx="42" ry="30" ${st}/>`;
 else if(k==="square")b=`<rect x="22" y="14" width="76" height="64" rx="10" ${st}/>`;
 else if(k==="heart")b=`<path d="M60 84C50 70 14 56 14 34 14 16 42 10 60 30 78 10 106 16 106 34 106 56 70 70 60 84Z" ${st}/>`;
 else{const n=k==="star"?10:6,P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2,r=k==="star"?(i%2?20:44):42;P.push((60+r*Math.cos(a)).toFixed(1)+","+(46+r*Math.sin(a)).toFixed(1))}b=`<polygon points="${P.join(" ")}" ${st}/>`}
 return`<svg viewBox="0 0 120 92">${b}</svg>`}

const PRENM={hati:"♥ Hati",bintang:"★ Bintang",bunga:"✿ Bunga",awan:"☁ Awan",kucing:"🐱 Kucing"};
function fromPts(raw){const n=84,P=raw.slice();P.push(P[0]);const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const tot=L[L.length-1]||1;let out=[],j=0;
 for(let i=0;i<n;i++){const d=i/n*tot;while(j<L.length-2&&L[j+1]<d)j++;const t=(d-L[j])/((L[j+1]-L[j])||1);out.push([P[j][0]+(P[j+1][0]-P[j][0])*t,P[j][1]+(P[j+1][1]-P[j][1])*t])}
 for(let p=0;p<2;p++)out=out.map((q,i,A)=>{const a=A[(i+n-1)%n],b=A[(i+1)%n];return[(a[0]+2*q[0]+b[0])/4,(a[1]+2*q[1]+b[1])/4]});
 const xs=out.map(q=>q[0]),ys=out.map(q=>q[1]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,k=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2||1;
 return out.map(q=>[+((q[0]-cx)/k).toFixed(3),+((q[1]-cy)/k).toFixed(3)])}
function sizeDC(){const c=$("dc2");if(!c||!c.getBoundingClientRect)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(!r.width)return;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);paint2()}
function paint2(){const c=$("dc2"),x=c&&c.getContext&&c.getContext("2d");if(!x)return;const w=c.width,h=c.height,k=Math.min(w,h)*.36,d=c.width/(c.getBoundingClientRect().width||c.width);
 x.clearRect(0,0,w,h);x.lineWidth=1;x.strokeStyle="#E8D6D0";const g=48*d;for(let i=g;i<w;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}for(let j=g;j<h;j+=g){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke()}
 x.setLineDash([10*d,8*d]);x.strokeStyle="#EFA7B8";x.beginPath();x.arc(w/2,h/2,k,0,6.283);x.stroke();x.setLineDash([]);
 const P=S.cpts||CAT;x.lineJoin=x.lineCap="round";x.lineWidth=5*d;x.strokeStyle="#D96B91";x.fillStyle="#FCE8EC";x.beginPath();const q=P.map(p=>[w/2+p[0]*k,h/2+p[1]*k]),n=q.length,m=i=>[(q[i%n][0]+q[(i+1)%n][0])/2,(q[i%n][1]+q[(i+1)%n][1])/2];
 x.moveTo(...m(n-1));for(let i=0;i<n;i++){const a=m(i);x.quadraticCurveTo(q[i][0],q[i][1],a[0],a[1])}x.closePath();x.fill();x.stroke();
 if(st2.length>1){x.strokeStyle="#713D50";x.lineWidth=4*d;x.beginPath();st2.forEach((p,i)=>x[i?"lineTo":"moveTo"](p[0],p[1]));x.stroke()}}
function ovRefresh(){$("ovUndo").disabled=!cstk.length;paint2();build()}
function openShape(){ovBk={shape:S.shape,cpts:S.cpts};cstk=[];st2=[];S.shape="custom";$("ovPre").innerHTML=Object.keys(PRENM).map(k=>`<button class="ch" data-pre="${k}">${PRENM[k]}</button>`).join("");
 $("ovPrev").appendChild($("vbox"));$("ov").hidden=false;document.body.style.overflow="hidden";ph=.62;auto=true;setTimeout(()=>{sizeDC();ovRefresh()},30);ovRefresh()}
function closeShape(ok){if(!ok&&ovBk){S.shape=ovBk.shape;S.cpts=ovBk.cpts}$("V").insertBefore($("vbox"),$("under"));$("ov").hidden=true;document.body.style.overflow="";if(ok)snap();drawAll()}
(function(){const c=$("dc2");if(!c.addEventListener)return;let on=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);on=true;st2=[pt(e)]});
 c.addEventListener("pointermove",e=>{if(!on)return;st2.push(pt(e));paint2()});
 const end=()=>{if(!on)return;on=false;if(st2.length>12){cstk.push(S.cpts);S.cpts=fromPts(st2);S.shape="custom"}st2=[];ovRefresh()};c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
 $("ovUndo").onclick=()=>{if(cstk.length){S.cpts=cstk.pop();ovRefresh()}};$("ovClear").onclick=()=>{cstk.push(S.cpts);S.cpts=null;ovRefresh()};
 $("ovOk").onclick=()=>closeShape(true);$("ovCancel").onclick=()=>closeShape(false);
 $("ovPre").addEventListener("click",e=>{const b=e.target.closest("[data-pre]");if(!b)return;cstk.push(S.cpts);S.cpts=fromPts(PRESET[b.dataset.pre]());S.shape="custom";ovRefresh()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("ov").hidden)closeShape(false)});
 if(typeof ResizeObserver!=="undefined")new ResizeObserver(()=>{if(!$("ov").hidden)sizeDC()}).observe($("ov"))})();

function enterFull(){const v=$("vbox");v.classList.add("pf");document.body.style.overflow="hidden";prevKit=kit;setKitchen(true);drawVT();side();try{if(v.requestFullscreen)v.requestFullscreen().catch(()=>{})}catch(_){}}
function exitFull(){const v=$("vbox");v.classList.remove("pf");document.body.style.overflow="";setKitchen(prevKit);try{if(document.fullscreenElement)document.exitFullscreen()}catch(_){}drawVT()}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&$("vbox").classList.contains("pf"))exitFull()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("vbox").classList.contains("pf"))exitFull()});
snap();drawAll();
Promise.all(FONTS.map(f=>document.fonts.load(`600 40px "${f}"`))).then(build).catch(()=>{});
