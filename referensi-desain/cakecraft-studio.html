<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CakeCraft – Custom Cake</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Pacifico&family=Fredoka:wght@500;600&family=Dancing+Script:wght@600&family=Nunito:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--soft:#FCE8EC;--cream:#FFF8F0;--rose:#EFA7B8;--pk:#D96B91;--ink:#713D50;--beige:#E8D6D0;--mut:#86566A;--pk2:#EFA7B8;--line:#E8D6D0;--panel:#FFF8F0}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:radial-gradient(900px 420px at 95% -5%,#EFA7B866,transparent),radial-gradient(800px 500px at -5% 105%,#EFA7B855,transparent),#FCE8EC}
body::before{content:"";position:fixed;right:-140px;top:-170px;width:460px;height:340px;border-radius:50%;background:#EFA7B866;z-index:-1}
body::after{content:"🧁";position:fixed;left:14px;bottom:70px;font-size:48px;opacity:.28;z-index:-1}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.hd{background:#FFF8F0cc;backdrop-filter:blur(10px);box-shadow:0 2px 16px #D96B911f}
.hd .in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo b{font:700 28px/1 "Baloo 2";color:#713D50}.logo small{display:block;font-size:11px;color:var(--mut);font-weight:700}
nav{display:flex;gap:24px;margin:0 auto;flex-wrap:wrap}nav a{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:10px 2px;border-bottom:3px solid transparent}nav a.on{color:var(--ink);border-color:var(--pk)}
.hr{display:flex;align-items:center;gap:16px}.cart{position:relative;font-size:20px}.cart i{position:absolute;top:-7px;right:-9px;background:var(--pk);color:#fff;font:800 11px/18px Nunito;width:18px;text-align:center;border-radius:50%}
.av{width:38px;height:38px;border-radius:50%;background:var(--pk);color:#fff;display:grid;place-items:center;font-weight:800}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 20px}
.steps{display:flex;justify-content:space-between;gap:4px;padding:16px 0 18px;overflow-x:auto}
.st{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--mut);position:relative}
.st:not(:last-child)::after{content:"";position:absolute;top:24px;left:calc(50% + 30px);right:calc(-50% + 30px);height:3px;border-radius:3px;background:#E8D6D0}
.st.done:not(:last-child)::after{background:var(--pk2)}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--cream);border:2px solid #E8D6D0;font-size:19px}
.st.done .ic{background:var(--rose);border-color:transparent;color:var(--ink);font-weight:800}
.st.cur .ic{background:var(--pk);border-color:transparent;color:#fff;box-shadow:0 0 0 5px #fff,0 8px 20px #D96B9166}
.st.cur,.st.done{color:#713D50}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
main.d{grid-template-columns:260px minmax(0,1fr) 300px}
.card{background:var(--panel);border:1.5px solid #E8D6D0;box-shadow:0 14px 34px #713D5026;border-radius:24px;padding:24px;min-height:470px}
main.d .card{padding:20px;min-height:0}#Rp{display:none}main.d #Rp{display:block}
.ttl{display:flex;gap:12px;align-items:center;margin-bottom:18px}.ti{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px;flex:none}
h1{font:700 26px/1.1 "Baloo 2"}.ttl p{color:var(--mut);font-size:14px;font-weight:600}
.back{color:var(--ink);font-weight:800;font-size:14px;margin-bottom:10px}
.lb{font-weight:800;font-size:13px;margin:18px 0 9px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.opt{background:var(--cream);border:2px solid #E8D6D0;border-radius:18px;padding:12px 8px 12px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;transition:.15s;box-shadow:0 2px 6px #D96B9114}
.opt:hover{transform:translateY(-2px);border-color:var(--pk2);box-shadow:0 8px 18px #D96B912b}
.opt.on{border-color:var(--pk);background:#FCE8EC;box-shadow:0 8px 20px #D96B9133}
.opt.on::after{content:"✓";position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--pk);color:#fff;font-size:13px;line-height:24px}
.opt svg{width:100%;height:auto;max-height:92px}.opt small{color:var(--mut);font-weight:700;font-size:12px}.opt em{font-style:normal;color:#713D50}
.opt .big{font-size:34px;line-height:1.3}.opt .sw{width:52px;height:52px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #E8D6D0,0 4px 10px #0002;margin:6px 0 4px}
.opt.dash{border-style:dashed}.opt.dash .big{font-size:52px;color:var(--mut);font-weight:400}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{padding:18px;border-radius:20px;border:2px solid #E8D6D0;background:var(--cream);text-align:left;display:grid;gap:4px}.mode.on{border-color:var(--pk);background:#FCE8EC}.mode b{font:700 18px "Baloo 2"}.mode span{font-size:13px;color:var(--mut);font-weight:600}.mode .mi{font-size:30px}
.tip{display:flex;align-items:center;gap:12px;background:#FCE8EC;border-radius:16px;padding:14px 16px;margin-top:20px;font-size:14px;font-weight:700}.tip::before{content:"i";width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:800 12px Nunito;flex:none}
.sc{display:flex;flex-wrap:wrap;gap:9px}.sc .ch{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:var(--cream);border:2px solid #E8D6D0;font-weight:800;font-size:14px}.sc .ch.on{border-color:var(--pk);background:#FCE8EC}.sc i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #E8D6D0}
input,textarea,select{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #E8D6D0;background:var(--cream);font-weight:700}textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rv{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border:1.5px solid #E8D6D0;border-radius:16px;padding:10px 16px;margin-bottom:8px}.rv small{color:var(--mut);display:block;font-size:12px;font-weight:700}.rv button{color:var(--ink);font-weight:800;text-decoration:underline;font-size:14px}
/* preview */
.vbox{position:relative;height:min(410px,52vh);border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#FFF8F0,#FCE8EC 55%,#EFA7B8);box-shadow:0 14px 34px #713D502e}
main.d .vbox{height:min(570px,70vh);background:linear-gradient(#ffffff55 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#ffffff55 1px,transparent 1px) 0 0/28px 28px,radial-gradient(circle at 50% 40%,#FFF8F0,#FCE8EC 70%,#EFA7B8)}
.vbox::before,.vbox::after{content:"✦";position:absolute;color:#fff;opacity:.9;pointer-events:none}.vbox::before{left:11%;top:22%;font-size:34px}.vbox::after{right:12%;top:46%;font-size:26px}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.vt{position:absolute;inset:12px 12px auto 12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.vt>*{pointer-events:auto}.vt .col{display:grid;gap:8px;align-content:start}
.ib{width:42px;height:42px;border-radius:13px;background:var(--cream);box-shadow:0 3px 10px #713D5033;font-size:17px;font-weight:800}.ib:disabled{opacity:.4}
.seg{display:flex;background:var(--cream);border-radius:14px;padding:4px;box-shadow:0 3px 10px #713D5033;height:fit-content}.seg button{padding:8px 16px;border-radius:11px;font-weight:800;font-size:14px}.seg .on{background:var(--pk);color:#fff}
.pill{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#ffffffe6;border-radius:99px;box-shadow:0 4px 14px #713D5033;padding:4px}.pill button{padding:9px 16px;border-radius:99px;font-weight:800;font-size:14px}.pill button.on{background:var(--soft)}
.fav{position:absolute;left:16px;top:48%;font-size:32px;color:var(--ink)}.fav.on{color:var(--pk)}
.under{margin-top:12px}.under .card{min-height:0;padding:18px 20px}
.sum{display:flex;gap:14px;align-items:center}.sum svg{width:84px;flex:none;background:var(--soft);border-radius:14px}.sum h3{font-size:15px}.sum p{font-size:13px;color:var(--mut);font-weight:700}
.tot{display:flex;justify-content:space-between;border-top:1.5px solid var(--line);margin-top:12px;padding-top:12px;font-weight:800}.tot span:last-child{color:var(--pk);font-size:21px}
.shp{display:grid;grid-template-columns:1.5fr .8fr 1fr;gap:12px;margin-top:10px}.shp canvas{background:linear-gradient(#E8D6D0 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,#E8D6D0 1px,transparent 1px) 0 0/20px 20px,#fff;border-radius:14px;border:2px solid #E8D6D0;cursor:crosshair;height:210px}
.tools{display:grid;gap:6px;align-content:start}.tools button{padding:10px;border-radius:12px;font-weight:800;font-size:14px;text-align:left}.tools button.on{background:var(--soft);color:var(--ink)}
.tips{background:#FCE8EC;border-radius:14px;padding:12px;font-size:13px;font-weight:700;color:var(--mut)}
/* desain */
.el{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;background:var(--cream);border:2px solid #E8D6D0;font-weight:800;margin-bottom:8px}.el.on{border-color:var(--pk);background:#FCE8EC}.el span:first-child{font-size:20px;width:26px;text-align:center}
.ep{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}.ep button{width:42px;height:42px;border-radius:12px;background:var(--cream);border:2px solid #E8D6D0;font-size:22px}
.pal{display:flex;gap:9px;flex-wrap:wrap}.pal button{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px #E8D6D0}.pal button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pk)}
.sub2{font-size:12px;color:var(--mut);font-weight:700;margin:-4px 0 8px}.hd2{font:700 17px "Baloo 2";margin-bottom:10px}
.rng{display:flex;gap:10px;align-items:center}.rng input[type=range]{padding:0;border:0;accent-color:var(--pk);background:none}.rng span{background:var(--cream);border:2px solid #E8D6D0;border-radius:10px;padding:5px 9px;font-size:13px;font-weight:800;white-space:nowrap}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg button{padding:10px;border-radius:12px;background:var(--cream);border:2px solid #E8D6D0;font-weight:800;font-size:14px}.sg button.on{background:#FCE8EC;border-color:var(--pk);color:var(--ink)}
.cnt{text-align:right;font-size:12px;color:var(--mut);font-weight:700;margin:3px 0 10px}
input[type=color]{padding:2px;height:42px;width:64px;cursor:pointer}
footer{display:flex;align-items:center;gap:18px;margin-top:20px;flex-wrap:wrap}
.btn{padding:15px 30px;border-radius:18px;font-weight:800;font-size:16px}.prv{background:var(--cream);box-shadow:0 4px 14px #713D502e}
.nxt{background:var(--pk);color:#fff;box-shadow:0 10px 22px #D96B9155}.nxt:hover{filter:brightness(.93)}
.trust{display:flex;gap:22px;font-size:13px;font-weight:700;flex-wrap:wrap}.fr{margin-left:auto;display:flex;align-items:center;gap:22px}.fr b{font:700 26px "Baloo 2"}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:.3s;z-index:20}.toast.show{transform:translate(-50%,0)}
@media(min-width:981px){main:not(.d) #V{position:sticky;top:12px}}
.thm{background:#EFA7B8;border-color:#ffffff88}.thm .ti{background:#ffffff99}
.rcpw{position:relative;max-width:430px;margin:30px auto 14px;filter:drop-shadow(0 12px 16px #713D5055);transform:rotate(-.6deg)}
.rc{position:relative;background:#FFF8F0;color:#713D50;font-family:"Courier Prime","Space Mono",ui-monospace,monospace;padding:30px 24px 26px;text-align:center}
.rc::before,.rc::after{content:"";position:absolute;left:0;right:0;height:10px;background-size:20px 100%}
.rc::before{top:-9px;background-image:conic-gradient(from 135deg at top,#FFF8F0 90deg,#0000 0)}
.rc::after{bottom:-9px;background-image:conic-gradient(from -45deg at bottom,#FFF8F0 90deg,#0000 0)}
.rc h2{font:700 34px "Courier Prime",monospace;letter-spacing:.3em;margin-right:-.3em}
.rc .s{font-size:11px;letter-spacing:.05em;margin:6px 0 2px}.rc .st2{font-size:17px;letter-spacing:.06em;margin:8px 0}
.rc .ast{overflow:hidden;white-space:nowrap;font-size:15px;font-weight:700;margin:8px 0}.rc .dt{font-weight:700;font-size:15px}
.rl{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;font:400 13px/1.35 "Courier Prime",monospace;padding:6px 4px;border-radius:4px;color:inherit}
button.rl:hover{background:#FCE8EC}.rl span:last-child{white-space:nowrap}
.rc .dbl{border-top:4px double #713D50;margin:10px 0}.rc .tt{display:flex;justify-content:space-between;font:700 18px "Courier Prime",monospace;padding:2px 4px}
.rc .bars{display:grid;gap:8px;margin:18px 0 12px}.rc .bars div{display:flex;gap:16px}.rc .bars i{height:10px;background:#713D50;display:block}
.rc svg.bc{width:100%;height:64px;display:block}
.stk{position:absolute;background:var(--cream);border:3px solid #EFA7B8;border-radius:18px;padding:5px 7px;font-size:30px;line-height:1;box-shadow:0 4px 10px #0003;z-index:2}
.hint2{text-align:center;font-size:13px;font-weight:700;color:#713D50}
.fl{display:grid;gap:6px;font-weight:800;font-size:13px;color:var(--mut)}
.card.rcp{padding:14px;background:#EFA7B8 linear-gradient(90deg,#ffffff55 50%,#0000 50%) 0 0/28px 28px;border:0}
.card.rcp::before{content:"";position:absolute}
.card.rcp{background-image:linear-gradient(90deg,#ffffff55 50%,#0000 50%),linear-gradient(#ffffff55 50%,#0000 50%);background-size:28px 28px}
.pp{position:relative;background:#FFF8F0;border-radius:34px;padding:26px 24px 22px;outline:2px dashed #EFA7B8;outline-offset:-10px;color:#713D50}
.pp .bub{font:700 clamp(44px,7vw,66px)/1 "Baloo 2";color:#D96B91;text-align:center;margin-top:6px;text-shadow:-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,3px 3px 0 #fff,0 6px 0 #EFA7B8}
.pp .thx{font:700 22px "Baloo 2";color:#D96B91;text-align:center}
.pp .rib{background:#EFA7B8;color:#713D50;font:700 12.5px Nunito;text-align:center;padding:6px 22px;margin:6px auto 0;width:fit-content;max-width:100%;clip-path:polygon(0 0,100% 0,97% 50%,100% 100%,0 100%,3% 50%)}
.pp .note{position:absolute;left:16px;top:22px;width:90px;background:#FFF8F0;border:2px solid #E8D6D0;border-radius:6px;padding:16px 6px 10px;text-align:center;font:600 13px/1.2 "Baloo 2";transform:rotate(-7deg);box-shadow:0 3px 8px #713D5033}
.pp .note::before{content:"";position:absolute;left:14px;right:14px;top:-8px;height:14px;background:#EFA7B8aa}
.pp .tul{position:absolute;right:16px;top:24px;font-size:38px}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pf{display:flex;align-items:center;gap:8px;border:2px solid #E8D6D0;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.dots{flex:1;border-bottom:2px dotted #EFA7B8;min-height:1.3em;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.tb{border:2px solid #E8D6D0;border-radius:14px;overflow:hidden;margin-top:14px}
.tb .tr{display:grid;grid-template-columns:34px 1fr 38px 84px 92px;border-bottom:1.5px dashed #E8D6D0}
.tb .tr>span{padding:8px 6px;border-left:1.5px solid #E8D6D0;min-height:34px;font-size:12.5px;font-weight:700}.tb .tr>span:first-child{border-left:0;text-align:center}
.tb .h>span{background:#EFA7B8;text-align:center;font-weight:800;border-left-color:#E8D6D0}
.tb .ds{text-align:left}.tb .rt{text-align:right}.tb .tl{border-bottom:0}.tb .tot2{background:#EFA7B8;text-align:center;font-weight:800}
.pn{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;margin-top:22px}
.bx{position:relative;border:2px solid #E8D6D0;border-radius:16px;padding:22px 14px 12px}
.tag{position:absolute;top:-13px;left:16px;background:#EFA7B8;color:#713D50;padding:2px 14px;font:600 14px "Baloo 2";font-style:normal;border-radius:4px}
.cb{display:block;text-align:left;font-weight:700;padding:5px 0;font-size:14px;width:100%}.oth{margin-top:2px;padding:4px 8px;border-radius:8px;font-size:13px}
.nt{border-bottom:2px dashed #E8D6D0;min-height:30px;padding:5px 2px;font-size:13px;font-weight:700}
.ty{font:600 44px/1 "Dancing Script",cursive;color:#D96B91;text-align:center;margin-top:22px}.ap{text-align:center;font-weight:700;font-size:14px;margin-bottom:4px}
.cup,.fl2{position:absolute;bottom:16px;font-size:34px}.cup{left:24px}.fl2{right:24px}
@media(max-width:600px){.pp .note,.pp .tul{display:none}.pr,.pn{grid-template-columns:1fr}.tb .tr{grid-template-columns:26px 1fr 28px 70px 76px}}
@media(max-width:980px){main,main.d{grid-template-columns:1fr}nav{display:none}.card{min-height:0}.shp{grid-template-columns:1fr}.fr{margin:0;width:100%;justify-content:space-between}.vbox,main.d .vbox{height:46vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hd"><div class="in"><div class="logo"><span style="font-size:38px">🧁</span><div><b>CakeCraft</b><small>Make Your Cake, Your Way</small></div></div>
<nav><a href="#">Beranda</a><a href="#">Katalog</a><a href="#" class="on">Custom Cake</a><a href="#">Pesanan</a><a href="#">Profil</a></nav>
<div class="hr"><span class="cart">🛒<i id="cartN">1</i></span><div class="av">A</div></div></div></div>
<div class="wrap">
<div class="steps" id="steps"></div>
<main id="main">
 <section class="card" id="L"></section>
 <section id="V"><div class="vbox" id="vbox"><canvas id="cv" aria-label="Pratinjau kue 3D"></canvas><div class="vt" id="vt"></div><button class="fav" id="fav" aria-label="Favorit">♡</button>
  <div class="pill"><button data-a="rot" data-v="-1" aria-label="Putar kiri">‹</button><button data-a="spin" id="bSpin" class="on">⟳ Putar</button><button data-a="rot" data-v="1" aria-label="Putar kanan">›</button></div></div>
  <div class="under" id="under"></div></section>
 <section class="card" id="Rp"></section>
</main>
<footer id="ft"></footer>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const rp=n=>"Rp "+n.toLocaleString("id-ID"),$=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SZ={mini:{d:10,p:85000,s:"1–2 orang"},small:{d:14,p:125000,s:"3–5 orang"},medium:{d:18,p:165000,s:"6–10 orang"},large:{d:22,p:210000,s:"10–15 orang"}};
const SHP={round:["Lingkaran",0],square:["Kotak",0],heart:["Hati",10000],star:["Bintang",15000],hex:["Hexagon",10000],custom:["Buat Sendiri",25000]};
const FLAV={vanilla:["Vanilla",0,"#fbefd5"],choco:["Cokelat",10000,"#8a5a3c"],velvet:["Red Velvet",15000,"#c0404e"],straw:["Stroberi",10000,"#f9cdd6"]};
const FILL={cream:["Krim Vanilla",0,"#fffaf0"],ganache:["Ganache Cokelat",8000,"#5b3322"],jam:["Selai Stroberi",5000,"#d6304a"],cheese:["Cream Cheese",12000,"#fff0c9"]};

function cakeSVG(size,body,ice){const rx=20+SZ[size].d*1.75,t=36,b=64,d=[8,15,6,13,9];
 let o=`<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="72" rx="56" ry="12" fill="#e8dce2"/><ellipse cx="60" cy="68" rx="56" ry="12" fill="#faf4f7"/><path d="M${60-rx},${t}V${b}A${rx},${rx*.28} 0 0 0 ${60+rx},${b}V${t}Z" fill="${body}"/>`;
 d.forEach((l,i)=>{const x=60-rx+8+i*(2*rx-16)/4;o+=`<rect x="${x-3.5}" y="${t}" width="7" height="${l+4}" rx="3.5" fill="${ice}"/>`});
 o+=`<ellipse cx="60" cy="${t}" rx="${rx}" ry="${rx*.28}" fill="${ice}"/>`;
 [[-.45,2],[0,-1],[.45,2]].forEach(([k,dy])=>{const x=60+rx*k;o+=`<circle cx="${x}" cy="${t-3+dy}" r="6" fill="#e0303f"/><path d="M${x-3},${t-8+dy}h6l-3 3z" fill="#3d9a4a"/>`});
 return o+`</svg>`}
function shapeSVG(k){const st=`fill="#fbefd5" stroke="#D96B91" stroke-width="4" stroke-linejoin="round"`;let b="";
 if(k==="round")b=`<ellipse cx="60" cy="46" rx="42" ry="30" ${st}/>`;
 else if(k==="square")b=`<rect x="22" y="14" width="76" height="64" rx="10" ${st}/>`;
 else if(k==="heart")b=`<path d="M60 84C50 70 14 56 14 34 14 16 42 10 60 30 78 10 106 16 106 34 106 56 70 70 60 84Z" ${st}/>`;
 else{const n=k==="star"?10:6,P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2,r=k==="star"?(i%2?20:44):42;P.push((60+r*Math.cos(a)).toFixed(1)+","+(46+r*Math.sin(a)).toFixed(1))}b=`<polygon points="${P.join(" ")}" ${st}/>`}
 return`<svg viewBox="0 0 120 92">${b}</svg>`}

function paintDC(){const c=$("dc");if(!c)return;const x=c.getContext("2d");x.clearRect(0,0,300,210);const P=S.cpts||(S.shape==="custom"?CAT:null);
 x.lineWidth=4;x.lineJoin=x.lineCap="round";x.strokeStyle="#D96B91";
 if(P){const k=85;x.beginPath();P.forEach((p,i)=>x[i?"lineTo":"moveTo"](150+p[0]*k,105+p[1]*k*.95));x.closePath();x.fillStyle="#FCE8EC";x.fill();x.stroke()}

 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);on=true;stroke=[pt(e)]};
 c.onpointermove=e=>{if(!on)return;stroke.push(pt(e));paintDC()};
 c.onpointerup=()=>{if(!on)return;on=false;if(stroke.length>12){const xs=stroke.map(p=>p[0]),ys=stroke.map(p=>p[1]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,k=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2||1,n=36;
  S.cpts=Array.from({length:n},(_,i)=>{const p=stroke[Math.floor(i*stroke.length/n)];return[(p[0]-cx)/k,(p[1]-cy)/k]});S.shape="custom";snap();stroke=[];drawL();side();paintDC();build()}else{stroke=[];paintDC()}}}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,it=sel();

 case"addE":{const n=S.items.filter(i=>i.t!=="text").length,k=ELS[+v][0],g=2*Math.PI*n/5;S.items.push({id:nid,t:"emoji",e:b.dataset.e,k,sz:1,x:k==="Topper"?0:.55*Math.sin(g),z:k==="Topper"?-.1:-.55*Math.cos(g)});S.sel=nid++;break}

 case"undo":if(hi>0){hi--;restore()}return;case"redo":if(hi<hist.length-1){hi++;restore()}return;

const cv=$("cv"),R3=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R3.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,50);
scene.add(new THREE.HemisphereLight(0xffffff,0xf8c9d4,.95));
const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(3,6,5);scene.add(dl);const dl2=new THREE.DirectionalLight(0xffd6e0,.35);dl2.position.set(-4,2,-3);scene.add(dl2);
const root=new THREE.Group(),cake=new THREE.Group();scene.add(root);root.add(cake);
const M=(c,r=.55,x={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,...x}),mesh=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const cyl=(a,b,h,s=48)=>new THREE.CylinderGeometry(a,b,h,s);
function heartShape(r){const s=new THREE.Shape();s.moveTo(0,-.9*r);s.bezierCurveTo(-.2*r,-.6*r,-r,-.3*r,-r,.25*r);s.bezierCurveTo(-r,.8*r,-.3*r,r,0,.55*r);s.bezierCurveTo(.3*r,r,r,.8*r,r,.25*r);s.bezierCurveTo(r,-.3*r,.2*r,-.6*r,0,-.9*r);return s}
function fp(R){const k=S.shape,s=new THREE.Shape();
 if(k==="round")s.absarc(0,0,R,0,Math.PI*2);
 else if(k==="square"){const a=R*.92,r=.16;s.moveTo(-a+r,-a);s.lineTo(a-r,-a);s.quadraticCurveTo(a,-a,a,-a+r);s.lineTo(a,a-r);s.quadraticCurveTo(a,a,a-r,a);s.lineTo(-a+r,a);s.quadraticCurveTo(-a,a,-a,a-r);s.lineTo(-a,-a+r);s.quadraticCurveTo(-a,-a,-a+r,-a)}
 else if(k==="heart")return heartShape(R*1.12);
 else if(k==="star"||k==="hex"){const n=k==="star"?10:6;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(k==="star"?Math.PI/2:0),r=k==="star"?(i%2?R*.58:R*1.2):R*1.05;s[i?"lineTo":"moveTo"](r*Math.cos(a),r*Math.sin(a))}s.closePath()}
 else{new THREE.CatmullRomCurve3((S.cpts||CAT).map(p=>new THREE.Vector3(p[0]*R*1.1,-p[1]*R*1.1,0)),true).getPoints(100).forEach((p,i)=>s[i?"lineTo":"moveTo"](p.x,p.y))}
 return s}
function solid(R,h,y,mat){if(S.shape==="round")return mesh(cyl(R,R,h,72),mat,0,y+h/2,0);
 const g=new THREE.ExtrudeGeometry(fp(R),{depth:h,bevelEnabled:true,bevelSize:.025,bevelThickness:.025,bevelSegments:2,curveSegments:40});g.rotateX(-Math.PI/2);g.translate(0,y,0);return new THREE.Mesh(g,mat)}
const emoCache={};
function emoTex(e){if(emoCache[e])return emoCache[e];const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");x.font="100px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(e,64,70);return emoCache[e]=new THREE.CanvasTexture(c)}
function textTex(it){const c=document.createElement("canvas");c.width=1024;c.height=512;const x=c.getContext("2d"),L=it.text.split("\n").slice(0,3),fs0=it.px*2.8;
 x.textBaseline="middle";x.textAlign=it.align;const ax=it.align==="left"?70:it.align==="right"?954:512;
 L.forEach((t,i)=>{let fs=fs0;do{x.font=`600 ${fs}px "${it.font}",cursive`;fs-=4}while(x.measureText(t).width>880&&fs>20);
  const y=256+(i-(L.length-1)/2)*fs0*1.1;
  if(it.fx==="shadow"){x.shadowColor="#0008";x.shadowBlur=10;x.shadowOffsetY=5}
  if(it.fx==="outline"){x.lineWidth=14;x.strokeStyle="#fff";x.lineJoin="round";x.strokeText(t,ax,y)}
  x.fillStyle=it.color;x.fillText(t,ax,y);x.shadowColor="transparent"});
 const tx=new THREE.CanvasTexture(c);tx.anisotropy=4;return tx}
let flame=null,lastSize=null;
function build(){
 while(cake.children.length){const c=cake.children[0];cake.remove(c);c.traverse(o=>{o.geometry&&o.geometry.dispose();if(o.material){if(o.material.map&&!o.isSprite)o.material.map.dispose();o.material.dispose()}})}
 flame=null;const R=SZ[S.size].d/12,H=1.04,ice=S.icing,add=o=>cake.add(o);
 if(lastSize!==S.size){dist=R*2.6+3.6;lastSize=S.size}
 const pr=R*1.35+.55;
 add(mesh(cyl(pr,pr,.08,72),M("#f3eaef",.3),0,-.04,0));add(mesh(cyl(.5,.65,.5,32),M("#f3eaef",.3),0,-.33,0));add(mesh(cyl(Math.min(1.1,pr*.55),Math.min(1.1,pr*.55),.08,48),M("#e9dde3",.3),0,-.58,0));
 add(solid(R,H,0,M(FLAV[S.flavor][2],.65)));add(solid(R*1.01,.07,H*.46,M(FILL[S.fill][2],.5)));add(solid(R*1.015,.1,H-.06,M(ice,.25)));
 const top=H+.1;
 if(S.deco.drip){const n=Math.round(R*16),L=[.2,.38,.15,.46,.28,.34];fp(R*1.02).getSpacedPoints(n).slice(0,-1).forEach((p,i)=>{const l=L[i%6];add(mesh(cyl(.065,.065,l,10),M(ice,.25),p.x,H-l/2,-p.y));add(mesh(new THREE.SphereGeometry(.065,10,8),M(ice,.25),p.x,H-l,-p.y))})}
 const kinds=["straw","berry","flower"].filter(k=>S.deco[k]);
 if(kinds.length){const n=Math.max(8,Math.round(R*10));fp(R).getSpacedPoints(n).slice(0,-1).forEach((p,i)=>{const x=p.x*.74,z=-p.y*.74,y=top;
  if(i%2===0){add(mesh(new THREE.SphereGeometry(.14,16,12),M("#FFF8F0",.4),x,y+.05,z));add(mesh(new THREE.SphereGeometry(.08,12,10),M("#fff",.4),x,y+.2,z));return}
  const k=kinds[(i>>1)%kinds.length];
  if(k==="straw"){const b=mesh(new THREE.SphereGeometry(.14,16,12),M("#e0303f",.35),x,y+.1,z);b.scale.set(1,1.2,1);add(b);add(mesh(new THREE.ConeGeometry(.08,.07,6),M("#3d9a4a"),x,y+.27,z))}
  else if(k==="berry")add(mesh(new THREE.SphereGeometry(.12,14,12),M(["#4a4a94","#c2185b","#3b2a4f"][i%3],.3),x,y+.08,z));
  else{for(let j=0;j<5;j++){const a=j/5*Math.PI*2,q=mesh(new THREE.SphereGeometry(.07,10,8),M("#fff",.5),x+.08*Math.cos(a),y+.06,z+.08*Math.sin(a));q.scale.y=.6;add(q)}add(mesh(new THREE.SphereGeometry(.05,10,8),M("#f7c948"),x,y+.09,z))}})}
 if(S.deco.spr){const cs=["#ff6f91","#ffd166","#06d6a0","#118ab2","#fff"],P=fp(R*.85).getSpacedPoints(40);for(let i=0;i<90;i++){const p=P[i%40],k=Math.sqrt(Math.random()),b=mesh(new THREE.BoxGeometry(.1,.025,.025),M(cs[i%5]),p.x*k,top-.01,-p.y*k);b.rotation.y=Math.random()*3;add(b)}}
 if(S.deco.candle){const z=-R*.4;add(mesh(cyl(.035,.035,.45,12),M("#ffd1dc"),0,top+.2,z));flame=mesh(new THREE.SphereGeometry(.055,12,10),new THREE.MeshBasicMaterial({color:"#ffcf4a"}),0,top+.48,z);flame.scale.y=1.6;add(flame)}
 S.items.forEach(it=>{
  if(it.t==="text"){if(!it.text.trim())return;const side=["round","square","hex"].includes(S.shape),mt=new THREE.MeshBasicMaterial({map:textTex(it),transparent:true,depthWrite:false});
   if(side){const zf=(S.shape==="round"?R:S.shape==="square"?R*.92:R*1.05*.866)+.06,w=Math.min(R*1.7,1.9),p=mesh(new THREE.PlaneGeometry(w,w/2),mt,0,H*.42,zf);add(p)}
   else{const w=R*1.7,p=mesh(new THREE.PlaneGeometry(w,w/2),mt,0,H+.08,R*.1);p.rotation.x=-Math.PI/2;add(p)}return}
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:it.t==="img"?null:emoTex(it.e),transparent:true}));
  const s=.5*it.sz*(it.k==="Topper"?1.4:1);sp.scale.set(s,s,1);sp.position.set(it.x*R,top+s*.45,it.z*R);
  if(it.t==="img")new THREE.TextureLoader().load(it.src,t=>{sp.material.map=t;sp.material.needsUpdate=true;sp.scale.set(s*t.image.width/Math.max(t.image.width,t.image.height)*1.4,s*t.image.height/Math.max(t.image.width,t.image.height)*1.4,1)});
  add(sp)});
}

cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);dragging=true;if(pts.size===2){const[a,b]=[...pts.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});

 pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);dist=Math.max(3.4,Math.min(11,dist*pd/d));pd=d}});

(function loop(t){requestAnimationFrame(loop);if(auto&&!dragging)th+=.006;root.rotation.y=th;cam.position.set(0,.5+dist*Math.sin(ph),dist*Math.cos(ph));cam.lookAt(0,.4,0);
